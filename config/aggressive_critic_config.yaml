behaviors:
  SkeletonAI:  # <--- THIS MUST MATCH "Behavior Name" in Unity Inspector!
    trainer_type: ppo
    hyperparameters:
      batch_size: 128
      buffer_size: 2048
      learning_rate: 3.0e-4
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256 # Increased for complex behavior
      num_layers: 2
    reward_signals:
      # 1. Extrinsic Reward (The code-based rewards you wrote)
      extrinsic:
        gamma: 0.99
        strength: 1.0
      
      # 2. GAIL Reward (The Imitation Part)
      gail:
        strength: 0.5
        gamma: 0.99
        demo_path: TrainingConfig/ExpertAggressive.demo # <--- YOUR FILE NAME HERE
    
    behavioral_cloning:
      strength: 0.5
      demo_path: TrainingConfig/ExpertAggressive.demo
      
    max_steps: 500000 # Run for half a million steps
    time_horizon: 64
    summary_freq: 10000